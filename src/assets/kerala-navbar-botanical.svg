<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" fill="none">
 <defs>
  <linearGradient id="tender-husk" x1="0" y1="40" x2="0" y2="128" gradientUnits="userSpaceOnUse"><stop stop-color="#AAB58B" stop-opacity=".62"/><stop offset=".48" stop-color="#899A72" stop-opacity=".58"/><stop offset="1" stop-color="#718364" stop-opacity=".55"/></linearGradient>
  <linearGradient id="coconut-water" x1="600" y1="44" x2="600" y2="66" gradientUnits="userSpaceOnUse"><stop stop-color="#F4EDDA" stop-opacity=".82"/><stop offset="1" stop-color="#E1D3AE" stop-opacity=".76"/></linearGradient>
 </defs>

 <!-- very light sea horizon and shore -->
 <g stroke="#6F9186" stroke-linecap="round" stroke-linejoin="round">
  <path d="M110 120c93-12 170-10 247 2m450-2c83-11 158-9 231 2m50-2c48-6 89-5 133 2" stroke-width="1.7" opacity=".23"/>
  <path d="M150 132c66-7 125-6 185 2m566-1c61-7 115-5 168 2m61-2c32-4 60-3 89 1" stroke-width="1.2" opacity=".17"/>
 </g>

 <!-- clearly cut tender coconut with white rim and a single straw -->
 <g stroke="#64775D" stroke-linecap="round" stroke-linejoin="round">
  <!-- tapered green husk -->
  <path d="M553 58c7-9 23-14 47-14s40 5 47 14l-5 34c-3 20-17 31-42 34-25-3-39-14-42-34l-5-34Z" fill="url(#tender-husk)" stroke-width="2.2" opacity=".86"/>
  <!-- flat trimmed top -->
  <path d="M553 58c8-11 24-17 47-17s39 6 47 17c-10 9-26 13-47 13s-37-4-47-13Z" fill="#D6D6B7" stroke-width="2.1" opacity=".9"/>
  <!-- pale cut flesh and water opening -->
  <ellipse cx="600" cy="57" rx="36" ry="9.2" transform="rotate(-1 600 57)" fill="url(#coconut-water)" stroke="#78816A" stroke-width="1.5" opacity=".94"/>
  <ellipse cx="601" cy="58" rx="11" ry="3.2" transform="rotate(-1 601 58)" fill="#B9C7AE" stroke="#76866C" stroke-width="1" opacity=".8"/>
  <!-- straw -->
  <path d="m603 58 12-39 6 1-10 40" fill="#F2E6C6" stroke="#A78353" stroke-width="2" opacity=".85"/>
  <path d="m615 22 6 2" stroke="#A78353" stroke-width="1.2" opacity=".62"/>
  <!-- natural husk seams and trimmed base -->
  <path d="M567 74c4 19 11 32 21 42m-8-42c2 22 8 38 17 48m-3-48c0 20 3 35 8 46m8-47c-1 18-1 31-4 42m15-43c-4 16-8 27-13 36" stroke="#E5E5C8" stroke-width="1.4" opacity=".55"/>
  <path d="M557 91c22 7 63 7 86 0m-77 13c17 5 50 5 68 0" stroke="#60755B" stroke-width="1.1" opacity=".35"/>
  <!-- small woven coaster -->
  <path d="M548 126c23 8 79 8 104 0l-5 8c-27 7-69 7-94 0l-5-8Z" fill="#D9CDAE" stroke="#897D60" stroke-width="1.4" opacity=".65"/>
  <path d="M556 129c25 6 62 6 88 0m-76 5c19 4 44 4 64 0" stroke="#A3926B" stroke-width="1" opacity=".55"/>
 </g>

 <!-- discreet sun haze and a few loose watercolor wave strokes -->
 <circle cx="814" cy="47" r="17" fill="#E4D2AA" opacity=".16"/>
 <g stroke="#92AA9B" stroke-linecap="round">
  <path d="M730 104c25-7 48-7 70 0m20 6c20-5 39-4 58 1m-277 1c18-5 36-4 52 0" stroke-width="1.5" opacity=".18"/>
  <path d="M899 37c14-7 27-6 40 1m-22 8c11-5 21-5 32 0" stroke-width="1.3" opacity=".15"/>
 </g>
</svg>